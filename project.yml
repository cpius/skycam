name: SkyCam
options:
  bundleIdPrefix: dk.dorup
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 6A6KNC6Z5K   # Mads Dorup (Personal Team): free provisioning, re-install every 7 days
    CODE_SIGN_STYLE: Automatic
targets:
  SkyCam:
    type: application
    platform: iOS
    sources: [SkyCam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dorup.skycam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: NO
    info:
      path: SkyCam/Info.plist
      properties:
        CFBundleDisplayName: SkyCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: SkyCam takes RAW photos of the night sky under remote control from your Mac.
        NSLocalNetworkUsageDescription: SkyCam is controlled from your Mac over the local Wi-Fi network and serves the captured files to it.
        NSBonjourServices: [_skycam._tcp]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
